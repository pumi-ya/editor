<style>
:root{
  --bg:#f4f3f0; --panel:#fff; --line:#e4e2dd; --ink:#222; --sub:#888; --accent:#222; --soft:#f1f0ec;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:14px}
.app{display:grid;grid-template-columns:1fr 340px;height:100vh}
.left{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;min-height:0;
  background-image:linear-gradient(45deg,#ebe9e4 25%,transparent 25%),linear-gradient(-45deg,#ebe9e4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ebe9e4 75%),linear-gradient(-45deg,transparent 75%,#ebe9e4 75%);
  background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
#cv{touch-action:none;-webkit-user-select:none;user-select:none;max-width:100%;max-height:100%;box-shadow:0 6px 30px rgba(0,0,0,.15);display:none;cursor:grab;background:#fff}
#cv.drag{cursor:grabbing}
.drop{border:2px dashed #c9c6bf;border-radius:16px;padding:60px 40px;text-align:center;color:var(--sub);background:rgba(255,255,255,.7);cursor:pointer}
.drop b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.stage.over .drop{border-color:var(--ink);background:#fff}
.stage.over{outline:3px dashed var(--ink);outline-offset:-10px}
.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--sub);background:rgba(255,255,255,.85);padding:4px 10px;border-radius:20px;display:none;white-space:nowrap}
.origTag{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;font-size:12px;padding:4px 12px;border-radius:20px;display:none}
.cmpBtn{-webkit-touch-callout:none;position:absolute;top:14px;right:14px;display:none;user-select:none;-webkit-user-select:none;touch-action:none}
.strip{display:none;gap:8px;padding:10px 14px;background:#fff;border-top:1px solid var(--line);overflow-x:auto;align-items:center}
.th{position:relative;flex-shrink:0;width:64px;height:64px;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#eee}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.on{border-color:var(--ink)}
.th .gps{position:absolute;left:2px;bottom:2px;background:#d33;color:#fff;font-size:10px;padding:1px 5px;border-radius:6px}
.meta{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6}
.meta .t{font-weight:700;margin-bottom:2px}
.meta .k{color:#666;display:inline-block;min-width:80px}
.meta .warn{color:#c33;font-weight:600}
.meta .ok{color:#1a7f45;font-weight:700;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.th .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:18px;padding:0;cursor:pointer}
.addTh{flex-shrink:0;width:64px;height:64px;border-radius:8px;border:2px dashed #c9c6bf;background:#fff;color:var(--sub);font-size:22px;cursor:pointer}
.side{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 40px}
h1{font-size:17px;margin:0 0 14px}
.sec{border-top:1px solid var(--line);padding:14px 0}
.sec h2{font-size:13px;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.row label{width:62px;color:#555;flex-shrink:0;font-size:13px}
.row input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.val{width:44px;text-align:right;font-variant-numeric:tabular-nums;color:#555;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.num{width:76px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:1}
.seg button{flex:1;border:0;background:#fff;padding:6px;font-family:inherit;font-size:12px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.seg button:disabled{color:#bbb;cursor:default}
input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;background:#fff;cursor:pointer}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.dark:hover{opacity:.88}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
.txt{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;min-width:0}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pitem{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.pitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.pitem .nm small{color:var(--sub);margin-left:6px}
.pitem.cur{border-color:var(--ink)}
.empty{color:var(--sub);font-size:12px}
.note{color:var(--sub);font-size:12px;margin:4px 0 0}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:8;padding:16px}
.modalBg.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{margin:0 0 14px;font-size:15px}
.opt{display:flex;align-items:flex-start;gap:8px;margin:10px 0;font-size:13px;cursor:pointer}
.opt input{margin-top:2px;accent-color:var(--ink)}
.opt small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.optGroup{border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin:10px 0}
.optGroup .gt{font-size:13px;font-weight:700;margin:8px 0 2px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (max-width:760px){
  .app{display:block;height:auto}
  .left{position:sticky;top:0;z-index:5;background:var(--bg);box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .stage{height:42vh;height:42svh;flex:none;padding:10px}
  .drop{padding:30px 20px}
  .strip{padding:6px 10px;gap:6px}
  .th,.addTh{width:46px;height:46px}
  .th .x{width:20px;height:20px;line-height:20px}
  .side{border-left:0;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
  h1{font-size:16px}
  .btn{min-height:40px;padding:8px 12px}
  .btn.sm{min-height:34px;padding:6px 10px}
  .chip{padding:8px 12px;font-size:13px}
  .seg button{padding:10px 6px;font-size:13px}
  .num,.txt{font-size:16px;padding:8px 10px}
  .row{margin:10px 0}
  .row input[type=range]{height:30px}
  input[type=color]{width:40px;height:34px}
  .hint{font-size:11px;bottom:6px}
  .cmpBtn{top:8px;right:8px;min-height:34px;font-size:12px}
  .origTag{top:8px}
  .pitem{padding:8px 10px}
  .toast{bottom:calc(20px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="stage" id="stage">
      <div class="drop" id="drop"><b>사진 넣기</b>클릭 · 끌어다 놓기 · Ctrl+V 붙여넣기<br>여러 장 한 번에 넣어도 돼요</div>
      <canvas id="cv"></canvas>
      <div class="origTag" id="origTag">원본</div>
      <button class="btn cmpBtn" id="cmpBtn">누르고 있으면 원본</button>
      <div class="hint" id="hint">사진 드래그 → 위치 조정 · 스페이스바 누르고 있으면 원본</div>
    </div>
    <div class="strip" id="strip"></div>
  </div>
  <div class="side">
    <h1>푸미편집기</h1>
    <div class="row" style="margin-top:0">
      <button class="btn" id="btnOpen">사진 추가</button>
      <button class="btn" id="btnReset">설정 초기화</button>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <div class="sec">
      <h2>사이즈</h2>
      <div class="chips" id="sizeChips"></div>
      <div class="row">
        <input class="num" type="number" id="w" min="1" max="8000"> ×
        <input class="num" type="number" id="h" min="1" max="8000"> px
      </div>
      <div class="row">
        <label>맞춤</label>
        <div class="seg" id="fitSeg">
          <button data-v="cover">꽉 채우기</button>
          <button data-v="contain">전체 보이기</button>
        </div>
      </div>
      <div class="row" id="padRow"><label>여백 색</label><input type="color" id="pad" value="#ffffff"></div>
      <div class="row"><label>확대</label><input type="range" id="zoom" min="100" max="300" value="100"><span class="val" id="zoomV"></span></div>
      <p class="note">확대·위치는 사진마다 따로 기억해요</p>
    </div>
    <div class="sec">
      <h2>필터</h2>
      <div class="chips" id="filterChips"></div>
    </div>
    <div class="sec">
      <h2>보정</h2>
      <div class="row"><label>밝기</label><input type="range" id="bri" min="-100" max="100" value="0"><span class="val" id="briV"></span></div>
      <div class="row"><label>대비</label><input type="range" id="con" min="-100" max="100" value="0"><span class="val" id="conV"></span></div>
      <div class="row"><label>채도</label><input type="range" id="sat" min="-100" max="100" value="0"><span class="val" id="satV"></span></div>
    </div>
    <div class="sec">
      <h2>흐림</h2>
      <div class="row"><label>흐림</label><input type="range" id="blur" min="0" max="60" value="0"><span class="val" id="blurV"></span></div>
    </div>
    <div class="sec">
      <h2>색 덮기</h2>
      <div class="row">
        <label>색</label>
        <button class="chip" data-col="#ffffff" data-t="ovCol">하양</button>
        <button class="chip" data-col="#000000" data-t="ovCol">검정</button>
        <input type="color" id="ovCol" value="#ffffff">
      </div>
      <div class="row"><label>불투명도</label><input type="range" id="ovOp" min="0" max="100" value="0"><span class="val" id="ovOpV"></span></div>
    </div>
    <div class="sec">
      <h2>비네팅</h2>
      <div class="row">
        <label>색</label>
        <button class="chip" data-col="#000000" data-t="vCol">검정</button>
        <button class="chip" data-col="#ffffff" data-t="vCol">하양</button>
        <input type="color" id="vCol" value="#000000">
      </div>
      <div class="row"><label>강도</label><input type="range" id="vAmt" min="0" max="100" value="0"><span class="val" id="vAmtV"></span></div>
      <div class="row"><label>범위</label><input type="range" id="vSize" min="0" max="100" value="50"><span class="val" id="vSizeV"></span></div>
    </div>
    <div class="sec">
      <h2>그레인 <button class="btn sm" id="reseed">입자 다시 뿌리기</button></h2>
      <div class="row"><label>강도</label><input type="range" id="gAmt" min="0" max="100" value="0"><span class="val" id="gAmtV"></span></div>
      <div class="row"><label>입자 크기</label><input type="range" id="gSize" min="1" max="6" step="0.5" value="1"><span class="val" id="gSizeV"></span></div>
    </div>
    <div class="sec">
      <h2>설정 저장</h2>
      <div class="row">
        <input class="txt" id="pName" placeholder="설정 이름 (예: 뽀얀 필름)">
        <button class="btn dark" id="pSave">저장</button>
      </div>
      <div class="plist" id="plist"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" id="jsonOut">JSON 내보내기</button>
        <button class="btn sm" id="jsonIn">JSON 불러오기</button>
        <input type="file" id="jsonFile" accept=".json,application/json" hidden>
      </div>
      <p class="note">JSON에는 사진 정보가 포함되어 있으니 타인에게 공유 시 주의해주세요</p>
    </div>
    <div class="sec">
      <h2>이미지 저장</h2>
      <div class="row">
        <label>형식</label>
        <div class="seg" id="fmtSeg">
          <button data-v="png">PNG</button>
          <button data-v="jpg">JPG</button>
        </div>
      </div>
      <div class="row">
        <label>범위</label>
        <div class="seg" id="scopeSeg">
          <button data-v="one">이 사진만</button>
          <button data-v="all">전체 (ZIP)</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
        <button class="btn dark" id="dlClean">저장</button>
      </div>
    </div>
  </div>
</div>
<div class="modalBg" id="outBg"><div class="modal">
  <h3>JSON 내보내기</h3>
  <label class="opt"><input type="checkbox" id="outP" checked><span>저장된 설정 <b id="outPN"></b>개</span></label>
  <label class="opt"><input type="checkbox" id="outCur" checked><span>지금 작업 중인 설정<small>슬라이더 값 그대로</small></span></label>
  <label class="opt"><input type="checkbox" id="outPh" checked><span>사진 <b id="outPhN"></b>장도 같이 저장<small>확대·위치까지 같이 저장돼요. 사진이 들어가서 파일이 커져요</small></span></label>
  <div class="acts"><button class="btn" data-close>취소</button><button class="btn dark" id="outGo">내보내기</button></div>
</div></div>
<div class="modalBg" id="inBg"><div class="modal">
  <h3>JSON 불러오기</h3>
  <label class="opt" id="inPRow"><input type="checkbox" id="inP" checked><span>저장된 설정 <b id="inPN"></b>개 불러오기<small>이름이 같은 설정은 새것으로 바뀌어요</small></span></label>
  <label class="opt" id="inCurRow"><input type="checkbox" id="inCur" checked><span>마지막 작업 설정 적용<small>내보낼 때 쓰던 슬라이더 값으로 맞춰요</small></span></label>
  <div class="optGroup" id="inPhRow">
    <div class="gt">저장된 사진 <span id="inPhN"></span>장</div>
    <label class="opt"><input type="radio" name="inPh" value="add" checked><span>지금 사진에 추가</span></label>
    <label class="opt"><input type="radio" name="inPh" value="replace"><span>지금 사진 지우고 바꾸기</span></label>
    <label class="opt"><input type="radio" name="inPh" value="none"><span>사진은 안 불러오기</span></label>
  </div>
  <div class="acts"><button class="btn" data-close>취소</button><button class="btn dark" id="inGo">불러오기</button></div>
</div></div>
<div class="toast" id="toast"></div>
